version: 2
updates:
  - package-ecosystem: npm
    directory: /webapp/donjon
    schedule:
      interval: weekly
    groups:
      angular:
        patterns: ["@angular/*", "@angular-devkit/*", "ng-packagr", "zone.js"]
      tests:
        patterns: ["vitest", "@vitest/*", "jsdom", "@playwright/test"]
    ignore:
      # versions de TypeScript imposées par Angular
      - dependency-name: typescript
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      # générateur aléatoire des replays .sol/.rec : ne pas changer sans vérification
      - dependency-name: rand-seed
        update-types: ["version-update:semver-major"]
  - package-ecosystem: npm
    directories:
      - /ressources/extensions/vscode/donjon-fi-compagnon
      - /ressources/extensions/vscode/donjon-fi-lang
    schedule:
      interval: monthly
    ignore:
      # doit suivre engines.vscode
      - dependency-name: "@types/vscode"
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
